version: 2
updates:
  # Librerías: solo parches y versiones menores, agrupadas en un único PR semanal.
  # Los saltos mayores (Kotlin 2.x -> 3, Gradle 8 -> 9, Compose 1.8 -> 1.12...) se hacen a mano.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: [ "version-update:semver-minor" ]
      - dependency-name: "org.jetbrains.compose*"
        update-types: [ "version-update:semver-minor" ]
      - dependency-name: "gradle-wrapper"
        update-types: [ "version-update:semver-major" ]
    groups:
      librerias:
        patterns: [ "*" ]
  # Acciones de GitHub agrupadas en un único PR mensual.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      acciones:
        patterns: [ "*" ]
