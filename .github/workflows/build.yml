name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: solo lectura por defecto; el job de release pide escritura.
permissions:
  contents: read

jobs:
  secrets-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar y ejecutar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  android:
    name: Pruebas + APK Android
    needs: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo para publicar las capturas en la rama "capturas"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
      - name: Pruebas de lógica y de funcionamiento (audio MP3/WAV, interfaz)
        run: chmod +x gradlew && xvfb-run -a ./gradlew :composeApp:desktopTest --stacktrace
      - name: Capturas y reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Pentagrama-pruebas-capturas
          path: |
            composeApp/build/test-screenshots/
            composeApp/build/reports/tests/
          if-no-files-found: ignore
      - name: Resumen de rendimiento
        if: always()
        run: cat composeApp/build/test-screenshots/rendimiento.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Publicar capturas en la rama "capturas"
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d composeApp/build/test-screenshots ] || exit 0
          cd composeApp/build/test-screenshots
          printf '# Capturas de la app\n\nGeneradas automáticamente por las pruebas del commit %s.\n\n' "${GITHUB_SHA::7}" > README.md
          for f in *.png; do printf '### %s\n![%s](%s)\n\n' "$f" "$f" "$f" >> README.md; done
          if [ -f rendimiento.md ]; then cat rendimiento.md >> README.md; fi
          git init -q -b capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Capturas ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas
      - name: Compilar APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: Pentagrama-android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  desktop:
    name: App de escritorio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Crear aplicación portable
        shell: bash
        run: chmod +x gradlew && ./gradlew :composeApp:createDistributable --stacktrace
      - name: Empaquetar ZIP
        shell: bash
        run: |
          cd composeApp/build/compose/binaries/main/app
          if [ "$RUNNER_OS" == "Windows" ]; then 7z a ../../../../../../Pentagrama-${{ runner.os }}.zip Pentagrama; else zip -qr ../../../../../../Pentagrama-${{ runner.os }}.zip .; fi
      - uses: actions/upload-artifact@v7
        with:
          name: Pentagrama-desktop-${{ runner.os }}
          path: Pentagrama-${{ runner.os }}.zip

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ secrets-scan, android, desktop ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
