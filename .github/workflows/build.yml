name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Pruebas + APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas de la lógica (transcripción, modelo, layout)
        run: chmod +x gradlew && ./gradlew :composeApp:desktopTest --stacktrace
      - name: Compilar APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Pentagrama-android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  desktop:
    name: App de escritorio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Crear aplicación portable
        shell: bash
        run: chmod +x gradlew && ./gradlew :composeApp:createDistributable --stacktrace
      - name: Empaquetar ZIP
        shell: bash
        run: |
          cd composeApp/build/compose/binaries/main/app
          if [ "$RUNNER_OS" == "Windows" ]; then 7z a ../../../../../../Pentagrama-${{ runner.os }}.zip Pentagrama; else zip -qr ../../../../../../Pentagrama-${{ runner.os }}.zip .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Pentagrama-desktop-${{ runner.os }}
          path: Pentagrama-${{ runner.os }}.zip

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android, desktop ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
