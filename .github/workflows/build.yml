name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: solo lectura por defecto; el job de release pide escritura.
permissions:
  contents: read

jobs:
  secrets-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instalar y ejecutar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  android:
    name: Pruebas + APK Android
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
      - name: Pruebas de lógica y de funcionamiento (audio MP3/WAV, interfaz)
        run: chmod +x gradlew && xvfb-run -a ./gradlew :composeApp:desktopTest --stacktrace
      - name: Capturas y reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pentagrama-pruebas-capturas
          path: |
            composeApp/build/test-screenshots/
            composeApp/build/reports/tests/
          if-no-files-found: ignore
      - name: Compilar APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Pentagrama-android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  desktop:
    name: App de escritorio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Crear aplicación portable
        shell: bash
        run: chmod +x gradlew && ./gradlew :composeApp:createDistributable --stacktrace
      - name: Empaquetar ZIP
        shell: bash
        run: |
          cd composeApp/build/compose/binaries/main/app
          if [ "$RUNNER_OS" == "Windows" ]; then 7z a ../../../../../../Pentagrama-${{ runner.os }}.zip Pentagrama; else zip -qr ../../../../../../Pentagrama-${{ runner.os }}.zip .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Pentagrama-desktop-${{ runner.os }}
          path: Pentagrama-${{ runner.os }}.zip

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ secrets-scan, android, desktop ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
